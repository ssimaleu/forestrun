<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hands-on 1</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
            background:
                radial-gradient(circle at 20% 15%, #3b6b4a 0%, transparent 55%),
                linear-gradient(155deg, #2b5540 0%, #1e3d2b 55%, #162d20 100%);
            color: #2f3d31;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* ---------- Forest banner ---------- */
        .hero {
            position: relative;
            width: 100%;
            height: 300px;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 18px 40px rgba(10, 26, 17, 0.35);
        }
        .hero svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        .mist {
            animation: drift 18s linear infinite alternate;
        }
        .goat {
            animation: graze 5.5s ease-in-out infinite;
        }
        .candy {
            animation: bob 4s ease-in-out infinite;
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-9px) rotate(6deg); }
        }
        .sparkle {
            animation: twinkle 1.8s ease-in-out infinite;
        }
        .sparkle.s2 { animation-delay: 0.6s; }
        .sparkle.s3 { animation-delay: 1.2s; }
        .sparkle.s4 { animation-delay: 0.9s; }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; }
            50%      { opacity: 0.95; }
        }
        @keyframes drift {
            from { transform: translateX(-28px); }
            to   { transform: translateX(28px); }
        }
        @keyframes graze {
            0%, 100% { transform: translateY(0); }
            47%      { transform: translateY(-3px); }
            53%      { transform: translateY(-3px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .mist, .goat, .candy, .sparkle { animation: none; }
            .sparkle { opacity: 0.7; }
        }

        /* ---------- Content card ---------- */
        .card {
            background: linear-gradient(180deg, #fdfbf3 0%, #f6f3e6 100%);
            padding: 3.25rem 4.25rem;
            margin: auto 1.25rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow:
                0 22px 48px rgba(10, 26, 17, 0.45),
                0 2px 0 rgba(255, 255, 255, 0.7) inset;
            text-align: center;
            max-width: 90vw;
        }
        h1 {
            margin: 0 0 1.15rem;
            color: #2f5d3f;
            font-size: 2rem;
            letter-spacing: 0.4px;
        }
        h1::after {
            content: "";
            display: block;
            width: 56px;
            height: 3px;
            margin: 1rem auto 0;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, #6d9c76, transparent);
        }
        p {
            font-size: 1.12rem;
            line-height: 1.7;
            color: #46564a;
            margin: 0;
        }
        .student-id {
            margin-top: 1.75rem;
            padding-top: 1.35rem;
            border-top: 1px dashed #cfd9c8;
            font-size: 1rem;
            color: #6b7a68;
            letter-spacing: 0.3px;
        }
        .student-id strong {
            color: #2f5d3f;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header class="hero" role="img" aria-label="A misty forest at dawn">
        <svg viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#e2efde"/>
                    <stop offset="55%" stop-color="#c8dfc9"/>
                    <stop offset="100%" stop-color="#a9c9ae"/>
                </linearGradient>
                <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#3f7050"/>
                    <stop offset="100%" stop-color="#22402b"/>
                </linearGradient>
                <radialGradient id="sun" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#fff8dd" stop-opacity="0.95"/>
                    <stop offset="100%" stop-color="#fff8dd" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="cloudPink" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffd9ec"/>
                    <stop offset="100%" stop-color="#f19ec4"/>
                </linearGradient>
                <linearGradient id="mistFade" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
                    <stop offset="25%" stop-color="#ffffff" stop-opacity="0.35"/>
                    <stop offset="75%" stop-color="#ffffff" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                </linearGradient>
            </defs>

            <!-- sky + low sun -->
            <rect width="1200" height="300" fill="url(#sky)"/>
            <circle cx="905" cy="78" r="135" fill="url(#sun)"/>

            <!-- candy floating in the sky -->
            <g transform="translate(330 72)">
                <g class="candy">
                    <!-- wrapper twists -->
                    <path d="M-31 0 L-17 -8 L-17 8 Z" fill="#e56b90"/>
                    <path d="M31 0 L17 -8 L17 8 Z" fill="#e56b90"/>
                    <!-- candy body -->
                    <ellipse cx="0" cy="0" rx="20" ry="13" fill="#f9a8c0"/>
                    <!-- stripes -->
                    <path d="M-9 -12 q7 12 0 24" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M7 -12.5 q8 12.5 0 25" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <!-- shine -->
                    <ellipse cx="-7" cy="-5" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-22 -7 -5)"/>
                </g>
            </g>

            <!-- glittery pink cloud -->
            <g transform="translate(600 62)">
                <g fill="url(#cloudPink)">
                    <ellipse cx="-34" cy="8" rx="30" ry="16"/>
                    <ellipse cx="36" cy="8" rx="32" ry="16"/>
                    <ellipse cx="0" cy="-4" rx="40" ry="22"/>
                    <ellipse cx="0" cy="12" rx="58" ry="14"/>
                </g>
                <!-- glitter sparkles -->
                <g fill="#ffffff">
                    <path class="sparkle" transform="translate(-30 -10) scale(1.1)"
                          d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
                    <path class="sparkle s2" transform="translate(8 -16) scale(0.8)"
                          d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
                    <path class="sparkle s3" transform="translate(34 -2) scale(1.2)"
                          d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
                    <path class="sparkle s4" transform="translate(-8 8) scale(0.7)"
                          d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
                    <path class="sparkle s2" transform="translate(22 14) scale(0.9)"
                          d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
                </g>
            </g>

            <!-- far ridge -->
            <path d="M0 176 L130 132 L250 176 L380 126 L510 176 L640 140 L780 182 L910 134 L1050 176 L1200 142 L1200 300 L0 300 Z"
                  fill="#93bda1" opacity="0.7"/>

            <!-- distant pine row -->
            <g fill="#6d9e80" opacity="0.9">
                <path d="M120 202 l30 -70 l30 70 z"/>
                <path d="M205 208 l24 -56 l24 56 z"/>
                <path d="M280 200 l34 -78 l34 78 z"/>
                <path d="M660 206 l28 -64 l28 64 z"/>
                <path d="M735 200 l36 -80 l36 80 z"/>
                <path d="M830 208 l24 -54 l24 54 z"/>
                <path d="M950 202 l30 -68 l30 68 z"/>
                <path d="M1040 210 l22 -50 l22 50 z"/>
            </g>

            <!-- mist band -->
            <ellipse class="mist" cx="600" cy="222" rx="640" ry="22" fill="url(#mistFade)"/>

            <!-- near pines -->
            <g fill="#2f5d3f">
                <path d="M40 246 l52 -120 l52 120 z"/>
                <path d="M40 206 l52 -84 l52 84 z" fill="#376b49"/>
                <path d="M158 250 l40 -92 l40 92 z"/>
                <path d="M1096 250 l58 -132 l58 132 z"/>
                <path d="M1096 204 l58 -92 l58 92 z" fill="#376b49"/>
                <path d="M1012 252 l42 -96 l42 96 z"/>
            </g>

            <!-- ground -->
            <path d="M0 232 C 200 212, 420 250, 600 238 C 800 226, 980 250, 1200 230 L1200 300 L0 300 Z"
                  fill="url(#ground)"/>

            <!-- goat -->
            <g transform="translate(600 274) scale(1.32)">
                <g class="goat">
                    <!-- shadow -->
                    <ellipse cx="0" cy="1" rx="36" ry="6" fill="#162d20" opacity="0.3"/>

                    <!-- legs -->
                    <g fill="#f9b7d4">
                        <rect x="-24" y="-19" width="5.5" height="19" rx="2.6"/>
                        <rect x="-14" y="-19" width="5.5" height="19" rx="2.6"/>
                        <rect x="11" y="-19" width="5.5" height="19" rx="2.6"/>
                        <rect x="20" y="-19" width="5.5" height="19" rx="2.6"/>
                    </g>
                    <g fill="#4a4033">
                        <rect x="-25.5" y="-4" width="8" height="4.4" rx="2"/>
                        <rect x="-15.5" y="-4" width="8" height="4.4" rx="2"/>
                        <rect x="9.5" y="-4" width="8" height="4.4" rx="2"/>
                        <rect x="18.5" y="-4" width="8" height="4.4" rx="2"/>
                    </g>

                    <!-- tail -->
                    <path d="M-32 -38 q-9 -4 -6 -13" stroke="#f9b7d4" stroke-width="4.5" fill="none" stroke-linecap="round"/>

                    <!-- body -->
                    <circle cx="-16" cy="-32" r="18" fill="#f9b7d4"/>
                    <ellipse cx="4" cy="-32" rx="26" ry="17" fill="#f9b7d4"/>
                    <ellipse cx="4" cy="-26" rx="22" ry="9" fill="#ef9bc2" opacity="0.55"/>

                    <!-- neck -->
                    <ellipse cx="26" cy="-46" rx="8.5" ry="13" fill="#f9b7d4" transform="rotate(-18 26 -46)"/>

                    <!-- head -->
                    <ellipse cx="33" cy="-60" rx="11" ry="9.5" fill="#f9b7d4"/>
                    <ellipse cx="41.5" cy="-56.5" rx="7.5" ry="5.5" fill="#fbcfe3"/>
                    <!-- ears -->
                    <ellipse cx="25" cy="-64" rx="6" ry="3.4" fill="#f9b7d4" transform="rotate(-28 25 -64)"/>
                    <ellipse cx="40" cy="-66" rx="5" ry="3" fill="#f9b7d4" transform="rotate(18 40 -66)"/>
                    <!-- horns -->
                    <path d="M30.5 -68 q-4 -11 6 -14" stroke="#c2b193" stroke-width="3.4" fill="none" stroke-linecap="round"/>
                    <path d="M36 -69 q-1 -9 9 -10" stroke="#c2b193" stroke-width="3.4" fill="none" stroke-linecap="round"/>
                    <!-- beard -->
                    <path d="M38 -50.5 q3 9 -2 11 q-3.5 -5 -2.5 -11 z" fill="#fbcfe3"/>
                    <!-- eye -->
                    <circle cx="39.5" cy="-61" r="1.9" fill="#3b3227"/>
                    <!-- collar + bell -->
                    <path d="M22.5 -52 q5 3 10 2" stroke="#a0563a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
                    <circle cx="28.5" cy="-47.5" r="3.2" fill="#e0b13c"/>
                </g>
            </g>

            <!-- foreground grass -->
            <g stroke="#7aa87f" stroke-width="3" stroke-linecap="round" opacity="0.65">
                <path d="M186 284 l-5 -14"/>
                <path d="M196 287 l3 -16"/>
                <path d="M978 280 l-6 -15"/>
                <path d="M990 285 l4 -17"/>
                <path d="M420 292 l-4 -12"/>
            </g>
        </svg>
    </header>

    <div class="card">
        <h1>{{ title }}</h1>
        <p>Hello, this is a web app deployed at a local server!</p>
        <p class="student-id">Student ID: <strong>{{ student_id }}</strong></p>
    </div>
</body>
</html>
